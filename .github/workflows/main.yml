name: Push commit
on: 
  push:
    branches:
      - main
permissions:
  contents: write
  
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.head_ref }}
    - run: |
              date > generated.txt
              # Note: the following account information will not work on GHES
              git config user.name "carrickdojo"
              git config user.email "webmaster@carrickdojo.com"
              git add .
              git commit -m "generated"
              git push
        
    - uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: Recommit
        branch: prod
